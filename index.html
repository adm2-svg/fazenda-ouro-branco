<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fazenda Ouro Branco</title>

<!-- PWA: deixa instalar como app no celular, sem passar por loja -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12140f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fazenda OB">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // aplica o tema salvo antes de qualquer coisa renderizar, senão a
  // tela pisca com o tema padrão por um instante
  try {
    const temaSalvo = localStorage.getItem('fazenda-tema')
    if (temaSalvo) document.documentElement.setAttribute('data-tema', temaSalvo)
    const larguraSalva = localStorage.getItem('fazenda-largura')
    if (larguraSalva) document.documentElement.setAttribute('data-largura', larguraSalva)
  } catch (e) {}
</script>
<style>
:root{
  --bg:#12140f; --panel:#1a1d15; --surface2:#20241a; --line:#2b2f22; --line2:#383d2c;
  --txt:#ece7d8; --dim:#a9a793; --dim2:#7a7968;
  --serif:'Fraunces',serif; --sans:'Roboto',sans-serif;
  --rust:#a8623a; --gold:#c8a11a; --gold-rgb:200,161,26; --good-text:#5fae7d; --good-rgb:95,174,125;
  --warn-text:#d99a3d; --warn-rgb:217,154,61; --hover-bg:#242a1c;
}
/* Temas alternativos — trocados via data-tema no <html>, guardado no
   navegador. Mesmo princípio de "skin" que o sistema Gefoscal usa. */
html[data-tema="azul"]{
  --bg:#0d1420; --panel:#141d2c; --surface2:#182335; --line:#232f45; --line2:#2e3d58;
  --txt:#e6ecf5; --dim:#9aabc4; --dim2:#6d7c96;
  --rust:#3e79b8; --gold:#4fa8c9; --gold-rgb:79,168,201; --good-text:#5fae7d; --good-rgb:95,174,125;
  --warn-text:#d99a3d; --warn-rgb:217,154,61; --hover-bg:#1c2942;
}
html[data-tema="roxo"]{
  --bg:#15111e; --panel:#1e1829; --surface2:#241d33; --line:#332943; --line2:#40355a;
  --txt:#ece6f5; --dim:#b0a3c4; --dim2:#7d7096;
  --rust:#7c4dbd; --gold:#a873d6; --gold-rgb:168,115,214; --good-text:#5fae7d; --good-rgb:95,174,125;
  --warn-text:#d99a3d; --warn-rgb:217,154,61; --hover-bg:#2b2140;
}
html[data-tema="vermelho"]{
  --bg:#1a0f0f; --panel:#241616; --surface2:#2c1a1a; --line:#3d2323; --line2:#4d2b2b;
  --txt:#f5e6e6; --dim:#c49a9a; --dim2:#966d6d;
  --rust:#c0392b; --gold:#d9773d; --gold-rgb:217,119,61; --good-text:#5fae7d; --good-rgb:95,174,125;
  --warn-text:#e0a83d; --warn-rgb:224,168,61; --hover-bg:#331e1e;
}
html[data-tema="claro"]{
  --bg:#f5f3ec; --panel:#ffffff; --surface2:#f0ede3; --line:#ddd8c8; --line2:#c9c3ac;
  --txt:#241f14; --dim:#5c5540; --dim2:#8a8367;
  --rust:#a8623a; --gold:#a9820f; --gold-rgb:169,130,15; --good-text:#2f7d51; --good-rgb:47,125,81;
  --warn-text:#a5680a; --warn-rgb:165,104,10; --hover-bg:#e8e3d4;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;}
h1,h2,h3{font-family:var(--serif);font-weight:600;}
a{color:inherit;}
button{font-family:inherit;font-size:14px;color:var(--txt);}
/* input/select/textarea ficam em 16px (não 14px) DE PROPÓSITO: no
   iPhone (Safari), qualquer campo de digitação com fonte abaixo de
   16px faz o navegador dar zoom automático sozinho quando o dedo toca
   nele — e como o sistema não recarrega a página ao trocar de aba
   (é tudo a mesma página, só troca o conteúdo), esse zoom fica "preso"
   e some do jeito que a pessoa deixar quando ela sai do cadastro e vai
   pra outra tela, dando a sensação de "tenho que ficar puxando/tirando
   o zoom toda hora". Com 16px esse zoom automático nunca é disparado. */
input,select,textarea{font-family:inherit;font-size:16px;color:var(--txt);}
input,select,textarea{background:var(--surface2);border:1px solid var(--line2);border-radius:7px;padding:9px 11px;width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rust);}
.oculto{display:none!important;}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
.fundo-nav-mobile{display:none;}
.botao-abrir-menu{display:none;align-items:center;justify-content:center;width:38px;height:38px;
  border-radius:8px;background:var(--surface2);border:1px solid var(--line2);color:var(--txt);
  cursor:pointer;flex:none;margin-bottom:14px;}
.botao-abrir-menu svg{width:20px;height:20px;}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.nav .logo{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.nav .logo .icone{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:none;}
.nav h1{font-size:17px;margin:0;line-height:1.15;}
.nav .sub{color:var(--dim2);font-size:11px;margin:2px 0 22px;}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:7px;color:var(--dim);text-decoration:none;font-size:13.5px;margin-bottom:3px;cursor:pointer;}
.nav .grupo-titulo{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);margin:16px 4px 6px;opacity:.7;}
.nav .grupo-titulo:first-child{margin-top:0;}
.nav a svg{width:17px;height:17px;flex:none;}
.nav a:hover{background:var(--hover-bg);color:var(--txt);}
.nav a.ativo{background:var(--hover-bg);color:var(--txt);border-left:3px solid var(--rust);}
.nav .rodape-nav{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);}
.nav .rodape-nav button{display:flex;align-items:center;justify-content:center;gap:7px;}
.nav .rodape-nav button svg{width:15px;height:15px;flex:none;}
.nav .cabeca-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.conteudo{padding:24px 28px;max-width:1400px;transition:max-width .2s;}
html[data-largura="amplo"] .conteudo{max-width:1800px;}
html[data-largura="cheio"] .conteudo{max-width:none;}
/* mesmo truque do sistema Gefoscal: zoom escala tudo junto (fonte,
   espaçamento, imagens) nos modos mais espaçosos, sem precisar trocar
   cada font-size em px do sistema pra rem */
body{zoom:1;transition:zoom .2s;}
html[data-largura="amplo"] body{zoom:1.06;}
html[data-largura="cheio"] body{zoom:1.12;}
.largura-toggle{background:none;border:1px solid var(--line2);color:var(--dim);cursor:pointer;
  padding:6px 10px;border-radius:8px;font-size:12px;line-height:1;
  display:flex;align-items:center;gap:6px;transition:all .15s;}
.largura-toggle:hover{border-color:var(--rust);color:var(--txt);}
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.topo h2{margin:0 0 4px;font-size:23px;}
.topo p{margin:0;color:var(--dim2);font-size:13px;}
.btn,.btn-secundario{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:13.5px;}
.btn{background:var(--rust);color:#fff;}
.btn:hover{filter:brightness(1.1);}
.btn-secundario{background:var(--surface2);color:var(--txt);border:1px solid var(--line2);}
.btn-secundario:hover{border-color:var(--rust);color:var(--rust);}
.btn.mini,.btn-secundario.mini{padding:6px 10px;font-size:12px;}
.btn:disabled{opacity:.6;cursor:not-allowed;}
/* ---- Cards de resumo — mesmo padrão do ERP Gefoscal (resumo-topo/.bloco):
   respiro maior, hover sutil, barra de destaque encostada na borda quando
   o número pede atenção (bom/alerta), em vez de só mudar a cor do texto. ---- */
.resumo-topo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:12px;margin-bottom:20px;}
.bloco{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:19px 22px;
  display:flex;flex-direction:column;justify-content:center;transition:border-color .15s ease,box-shadow .15s ease;}
.bloco:hover{border-color:var(--dim2);}
.bloco.destaque{border-color:var(--rust);box-shadow:inset 3px 0 0 var(--rust);}
.bloco.alerta{border-color:var(--warn-text);box-shadow:inset 3px 0 0 var(--warn-text);}
.bloco.bom{border-color:var(--good-text);box-shadow:inset 3px 0 0 var(--good-text);}
.bloco .rot{color:var(--dim2);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;
  display:flex;align-items:center;justify-content:space-between;gap:10px;}
.bloco .val{font-family:var(--serif);font-size:32px;line-height:1.08;margin-top:10px;letter-spacing:-.01em;overflow-wrap:break-word;}
.bloco .nota{color:var(--dim);font-size:12.5px;margin-top:7px;}
.bloco.alerta .val{color:var(--warn-text);}
.bloco.bom .val{color:var(--good-text);}
@media (max-width:640px){.bloco .val{font-size:24px;}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;}
.subabas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.subabas button{border:1px solid var(--line2);background:var(--surface2);color:var(--dim);border-radius:20px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;}
.subabas button.ativo{background:var(--rust);border-color:var(--rust);color:#fff;}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:end;}
/* flex-basis fixo (não "auto") é o que evita o campo inflar pro tamanho
   que o CONTROLE NATIVO do navegador pede — no Safari do iPad, um
   <input type="date"> sozinho já pede uns 250-300px (escreve "25 de
   ago. de 2026" por extenso), e sem isso cada campo de data vira uma
   linha inteira sozinho, empurrando o resto pra baixo */
.campo{display:flex;flex-direction:column;gap:5px;flex:1 1 160px;min-width:130px;max-width:260px;}
.campo input[type="date"],.campo input[type="month"]{min-width:0;}
.campo label{font-size:11px;color:var(--dim2);text-transform:uppercase;letter-spacing:.04em;}
.form-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
.acoes{display:flex;gap:10px;flex-wrap:wrap;}
.tabela-scroll{overflow:auto;}
table{width:100%;border-collapse:collapse;min-width:700px;}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;}
th{color:var(--dim2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.num{text-align:right;}
.texto-dim{color:var(--dim);}
.texto-dim2{color:var(--dim2);}
.chip{display:inline-block;background:var(--surface2);border:1px solid var(--line2);border-radius:20px;padding:3px 10px;font-size:11px;}
.badge-bom{background:rgba(var(--good-rgb),.15);color:var(--good-text);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;}
.badge-alerta{background:rgba(var(--warn-rgb),.18);color:var(--warn-text);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;}
.grade-graficos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:18px;}
.cartao-grafico{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
.cartao-grafico h4{margin:0 0 14px;font-size:12.5px;font-weight:700;color:var(--dim2);text-transform:uppercase;letter-spacing:.06em;}
.linha-grafico{display:grid;grid-template-columns:100px 1fr auto;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}
.linha-grafico:last-child{margin-bottom:0;}
.rotulo-grafico{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.barra-fundo{background:var(--surface2);border-radius:5px;height:10px;overflow:hidden;}
.barra-preenchida{height:100%;border-radius:5px;min-width:3px;transition:width .3s ease;}
.valor-grafico{color:var(--txt);font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap;}
.barra-dupla{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface2);}
.barra-dupla div{height:100%;}
.legenda-dupla{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--dim2);}
.legenda-dupla span{display:inline-flex;align-items:center;gap:6px;}
.legenda-dupla i{width:9px;height:9px;border-radius:2px;display:inline-block;}
.donut{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:6px auto;}
.donut-centro{width:96px;height:96px;background:var(--panel);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.donut-centro b{font-family:var(--serif);font-size:22px;line-height:1.1;}
.donut-centro span{font-size:9.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.legenda-donut{display:flex;justify-content:center;gap:18px;margin-top:8px;font-size:12px;color:var(--dim2);}
.legenda-donut span{display:inline-flex;align-items:center;gap:6px;}
.legenda-donut i{width:9px;height:9px;border-radius:50%;display:inline-block;}
.vazio{color:var(--dim2);padding:20px;text-align:center;}
.cabeca-secao{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px;max-width:820px;width:100%;max-height:90vh;overflow:auto;}
.modal h3{margin:0 0 14px;font-size:18px;}
.recado{margin-top:10px;padding:9px 12px;border:1px solid var(--line2);border-radius:8px;font-size:12.5px;}
.passo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:8px;margin-bottom:6px;font-size:13px;}

/* ---- Dar baixa em compra — mesmo padrão do Financeiro do grupo ---- */
.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:14px 20px;}
.ficha .item .rot{color:var(--dim2);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;}
.ficha .item .val{font-size:13.5px;margin-top:3px;}
.pag-resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.pag-resumo>div{border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-width:0;}
.pag-resumo span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim2);font-weight:700;}
.pag-resumo b{display:block;font-size:19px;margin-top:5px;overflow-wrap:break-word;}
.pag-resumo .falta{border-color:var(--warn-text);}
.pag-resumo .falta b{color:var(--warn-text);}
.pag-resumo .ok{border-color:var(--good-text);}
.pag-resumo .ok b{color:var(--good-text);}
.pag-parcelas{display:flex;flex-direction:column;gap:7px;}
.pag-parcela{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;}
.pag-parcela .n{font-weight:700;color:var(--dim2);font-size:11.5px;min-width:26px;}
.pag-parcela .quanto{font-weight:700;font-variant-numeric:tabular-nums;}
.pag-parcela .onde{flex:1;min-width:120px;font-size:11.5px;}
.pag-parcela .acoes-parcela{display:flex;gap:6px;align-items:center;margin-left:auto;}
.linha-modulo{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;}
.linha-modulo .nome{flex:1;}
.aviso{color:var(--dim2);font-size:12px;margin-top:10px;}
@media (max-width:620px){
  .pag-resumo{grid-template-columns:1fr;}
  .pag-resumo b{font-size:17px;}
}

#tela-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px;max-width:380px;width:100%;text-align:center;}
.login-card .icone{width:76px;height:76px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.login-card h1{font-size:20px;margin:0 0 4px;}
.login-card p{color:var(--dim2);font-size:12.5px;margin:0 0 22px;}
.login-card input{margin-bottom:10px;}
.login-card .btn{width:100%;padding:12px;margin-top:6px;}
.login-erro{color:var(--warn-text);font-size:12.5px;margin-top:10px;}
.botao-tema{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--line2);
  color:var(--dim);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0;}
.botao-tema:hover{border-color:var(--rust);color:var(--rust);}
.botao-tema svg{width:17px;height:17px;}
.popover-tema{position:absolute;top:44px;right:0;background:var(--panel);border:1px solid var(--line2);
  border-radius:12px;padding:9px;display:flex;gap:8px;box-shadow:0 10px 28px rgba(0,0,0,.35);z-index:1001;}
.popover-tema.oculto{display:none;}
.swatch-tema{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid var(--line2);flex:none;padding:0;transition:transform .12s ease,border-color .12s ease;}
.swatch-tema:hover{transform:scale(1.12);}
.swatch-tema.ativo{border-color:var(--txt);box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--txt);}

/* ---- Tablet na faixa 861–1199px (ex.: iPad na horizontal) — mesmo
   comportamento do ERP Gefoscal: a barra lateral colapsa pra só ícones,
   liberando espaço pro conteúdo, mas a pessoa pode reabrir na mão pelo
   botãozinho ao lado da logo — e essa escolha manual é respeitada até
   girar a tela de novo (aí volta a decidir sozinho pela largura). ---- */
#btn-colapsar{background:none;border:1px solid var(--line2);color:var(--dim);cursor:pointer;
  width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;}
#btn-colapsar:hover{border-color:var(--rust);color:var(--rust);}
#btn-colapsar svg{width:16px;height:16px;transition:transform .2s ease;}
.app.nav-colapsada #btn-colapsar svg{transform:rotate(180deg);}
.app.nav-colapsada{grid-template-columns:68px 1fr;}
.app.nav-colapsada .nav{padding:20px 10px;}
.app.nav-colapsada .nav .logo{justify-content:center;}
.app.nav-colapsada .nav .logo h1,.app.nav-colapsada .nav .sub,.app.nav-colapsada .nav .grupo-titulo,
.app.nav-colapsada .nav a span,.app.nav-colapsada .nav .rotulo-nav{display:none;}
.app.nav-colapsada .nav .cabeca-nav{flex-direction:column;gap:10px;}
.app.nav-colapsada .nav a{justify-content:center;padding:10px 0;}
.app.nav-colapsada .nav .rodape-nav button{padding:9px;}
@media (min-width:861px) and (max-width:1199px){
  .conteudo{padding:18px clamp(12px,2vw,20px);}
}

/* =========================================================
   CELULAR/TABLET ESTREITO — um código só, que se reorganiza
   sozinho pela largura da tela (é assim que a Web já detecta
   "isso aqui é um celular": telefone = tela estreita, computador
   = tela larga, na prática dá no mesmo resultado de checar o
   aparelho, sem precisar manter duas versões separadas).
   ESTE BLOCO FICA POR ÚLTIMO NA FOLHA DE ESTILO DE PROPÓSITO —
   em CSS, quando duas regras da mesma "força" (especificidade)
   miram a mesma propriedade, quem vem DEPOIS no arquivo ganha,
   mesmo que a de cima esteja dentro de um @media que bateu. Um
   bloco de celular no meio do arquivo corre o risco de ser
   sobrescrito por uma regra "de sempre" mais abaixo — foi o que
   aconteceu com o padding do .conteudo antes desta correção.
   ========================================================= */
@media (max-width:820px){
  .app{grid-template-columns:1fr;}
  .nav{position:fixed;left:0;top:0;height:100vh;width:min(230px, 82vw);z-index:1000;
       transform:translateX(-100%);transition:transform .22s ease;box-shadow:2px 0 24px rgba(0,0,0,.35);
       padding-top:max(20px, env(safe-area-inset-top));}
  .nav.aberto{transform:translateX(0);}
  .fundo-nav-mobile{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;}
  .fundo-nav-mobile.aberto{display:block;}
  .botao-abrir-menu{display:flex;}
  .app.nav-colapsada{grid-template-columns:1fr;}
  #btn-colapsar{display:none!important;}
  .app.nav-colapsada .nav .logo h1,.app.nav-colapsada .nav .sub,.app.nav-colapsada .nav .grupo-titulo{display:block;}
  .app.nav-colapsada .nav a span,.app.nav-colapsada .nav .rotulo-nav{display:inline;}
  .conteudo{padding:16px 14px;padding-bottom:max(16px, env(safe-area-inset-bottom));max-width:none;}
  /* tela já estreita por natureza — "Amplo"/"Tela cheia" (que existem
     pra aproveitar monitor grande) não fazem sentido aqui, então o
     conteúdo já nasce ocupando o espaço todo e o botão some */
  body{zoom:1;}
  .largura-toggle{display:none;}
  .modal-fundo{padding:10px;}
  .modal{padding:16px;max-height:94vh;}
  .login-card{padding:22px;}
  .tabela-scroll{-webkit-overflow-scrolling:touch;}
  .topo{gap:10px;}
  /* textos pequenos (rótulo, cabeçalho de tabela, chip, legenda) foram
     pensados pra tela de computador, olhada de mais longe — no celular,
     perto do rosto, ficam difíceis de ler sem dar zoom. Aumenta só o
     suficiente pra ler direto, sem precisar de zoom nenhum. */
  .bloco .rot{font-size:11.5px;}
  th,td{font-size:14px;}
  th{font-size:11.5px;}
  .campo label{font-size:12px;}
  .chip,.badge-bom,.badge-alerta{font-size:12px;}
  .cartao-grafico h4{font-size:13px;}
  .linha-grafico{font-size:13.5px;}
  .valor-grafico{font-size:13px;}
  .legenda-dupla,.legenda-donut{font-size:13px;}
  .donut-centro span{font-size:10.5px;}
  .subabas button{font-size:13.5px;padding:9px 16px;}
  .nav a{font-size:14.5px;padding:12px 11px;}
  .recado,.passo{font-size:13.5px;}
  /* a bolha e o painel do Assistente são montados via JS com estilo
     inline (pra funcionar em qualquer página) — por isso o !important
     aqui: é a única forma de uma regra da folha de estilo vencer um
     estilo inline, não tem relação com a ordem no arquivo */
  #assist-bolha span:last-child{display:none;}
  #assist-bolha{padding:13px !important;border-radius:50% !important;
    right:max(14px, env(safe-area-inset-right)) !important;
    bottom:max(14px, env(safe-area-inset-bottom)) !important;}
  #assist-painel{right:10px !important;left:10px !important;width:auto !important;max-width:none !important;
    bottom:calc(66px + env(safe-area-inset-bottom)) !important;}
}
@media (max-width:380px){
  .login-card{padding:18px;}
  .login-card .icone{width:60px;height:60px;}
}
/* ---- Financeiro › Relatório anual — mesmo painel do ERP Gefoscal
   (Financeiro › Relatórios). Só token de tema, nada de cor fixa, pra
   ficar certo no escuro e no claro. A fazenda não tem --critico-text:
   cai no vermelho padrão. ---- */
.pnl-filtros{margin-bottom:14px;align-items:center;gap:9px;flex-wrap:wrap;}
.pnl-filtros select{font-size:13px;padding:6px 10px;width:auto;}
.pnl-origem{font-size:12.5px;line-height:1.55;margin:0 0 14px;padding:10px 13px;border:1px solid var(--line2);
  border-radius:9px;color:var(--dim);background:var(--panel);}
.pnl-origem b{color:var(--txt);}
.pnl-cartoes{display:grid;gap:12px;margin-bottom:20px;grid-template-columns:repeat(auto-fit,minmax(min(215px,100%),1fr));}
.pnl-cartao{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px 10px;min-width:0;overflow:hidden;}
.pnl-cartao.bom{box-shadow:inset 3px 0 0 var(--good-text);}
.pnl-cartao.ruim{box-shadow:inset 3px 0 0 var(--critico-text,#d9534f);}
.pnl-cartao .rot{color:var(--dim2);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;}
.pnl-cartao .val{font-size:26px;line-height:1.15;margin-top:7px;font-weight:600;overflow-wrap:break-word;font-variant-numeric:tabular-nums;}
.pnl-cartao.comprido .val{font-size:21px;}
.pnl-cartao .linha-var{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;}
.pnl-cartao .linha-var .nota{font-size:11.5px;color:var(--dim);}
.pnl-spark{width:100%;height:30px;margin-top:8px;display:block;opacity:.75;}
.pnl-var{font-size:11.5px;font-weight:700;white-space:nowrap;}
.pnl-var.bom{color:var(--good-text);}
.pnl-var.ruim{color:var(--critico-text,#d9534f);}
.pnl-var.neutro{color:var(--dim2);font-weight:600;}
.pnl-bloco{padding:18px;}
.pnl-secao{margin-bottom:18px;}
.pnl-bloco .cabeca-secao h3{font-family:var(--serif);font-size:16px;margin:0;}
.pnl-grafico{overflow-x:auto;overflow-y:hidden;}
.pnl-svg{width:100%;min-width:600px;height:auto;display:block;}
.pnl-legenda{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);}
.pnl-legenda i,.pnl-rank .nome i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px;flex:none;}
.pnl-rank{display:flex;flex-direction:column;gap:11px;margin-top:14px;}
.pnl-rank-item .topo{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;margin-bottom:4px;}
.pnl-rank-item .topo b{font-variant-numeric:tabular-nums;}
.pnl-rank-item .trilho{background:var(--surface2);border-radius:5px;height:9px;overflow:hidden;}
.pnl-rank-item .trilho>span{display:block;height:100%;border-radius:5px;}
.pnl-rank-item .nome{display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pnl-rank-item .dir{display:flex;align-items:baseline;gap:8px;white-space:nowrap;flex:none;}
.pnl-rosca{margin-bottom:6px;}
.pnl-retorno{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));}
.pnl-ret-col{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
.pnl-ret-col .rot{color:var(--dim2);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:8px;}
.pnl-ret-lin{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;color:var(--dim);}
.pnl-ret-lin b{color:var(--txt);font-variant-numeric:tabular-nums;font-weight:600;}
.pnl-ret-grande{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--line);
  margin:6px 0 4px;padding-top:8px;font-size:13px;font-weight:700;}
.pnl-ret-grande b{font-size:21px;font-variant-numeric:tabular-nums;}
.pnl-ret-grande.bom b{color:var(--good-text);font-size:16px;}
.pnl-ret-nota{font-size:11.5px;line-height:1.5;margin:12px 0 0;}
.pnl-param{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);align-items:end;}
.pnl-param .campo{min-width:150px;max-width:190px;}
@media (max-width:620px){
  .pnl-cartao .val{font-size:22px;}
  .pnl-rank-item .topo{flex-wrap:wrap;}
}
@media print{
  .menu,.lateral,.subabas,#rel-imprimir,#rel-tabela,.pnl-param,.pnl-filtros button,.pnl-filtros select{display:none!important;}
  .pnl-bloco,.pnl-cartao{break-inside:avoid;}
}
</style>
</head>
<body>

<div id="tela-login">
  <div class="login-card">
    <div class="icone"><img src="logo-icone.png" alt="Fazenda Ouro Branco" style="width:100%;height:100%;object-fit:contain;"></div>
    <h1>Fazenda Ouro Branco</h1>
    <input type="email" id="lg-email" placeholder="e-mail">
    <input type="password" id="lg-senha" placeholder="senha">
    <button class="btn" id="lg-entrar">Entrar</button>
    <div class="login-erro oculto" id="lg-erro"></div>
  </div>
</div>

<div class="app oculto" id="app">
  <nav class="nav">
    <div class="cabeca-nav">
      <div class="logo"><div class="icone"><img src="logo-icone.png" alt="Fazenda Ouro Branco" style="width:100%;height:100%;object-fit:contain;"></div><div><h1>Fazenda<br>Ouro Branco</h1></div></div>
      <button class="oculto" id="btn-colapsar" title="Recolher/expandir menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <div class="sub">Confinamento de gado</div>
    <div id="menu"></div>
    <div class="rodape-nav">
      <button class="btn-secundario mini oculto" id="btn-instalar" style="width:100%;margin-bottom:8px;" title="Instalar app">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="rotulo-nav">Instalar app</span>
      </button>
      <button class="btn-secundario mini" id="btn-sair" style="width:100%;" title="Sair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="rotulo-nav">Sair</span>
      </button>
    </div>
  </nav>
  <div class="fundo-nav-mobile" id="fundo-nav-mobile"></div>
  <main class="conteudo">
    <button class="botao-abrir-menu" id="btn-abrir-menu" title="Abrir menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="topo">
      <div><h2 id="titulo-pagina">Visão geral</h2><p id="subtitulo-pagina"></p></div>
      <div style="display:flex;gap:8px;align-items:center;position:relative;">
        <button class="largura-toggle" id="largura-toggle-app" title="Alternar largura do conteúdo">
          <span id="largura-icone">⇔</span><span id="largura-rotulo">Compacto</span>
        </button>
        <button class="botao-tema" id="btn-tema" title="Mudar tema" aria-label="Mudar tema">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </button>
        <div class="popover-tema oculto" id="popover-tema">
          <button class="swatch-tema" data-tema="" title="Verde &amp; Dourado" style="background:linear-gradient(135deg,#a8623a 50%,#c8a11a 50%);"></button>
          <button class="swatch-tema" data-tema="azul" title="Azul" style="background:linear-gradient(135deg,#3e79b8 50%,#4fa8c9 50%);"></button>
          <button class="swatch-tema" data-tema="roxo" title="Roxo" style="background:linear-gradient(135deg,#7c4dbd 50%,#a873d6 50%);"></button>
          <button class="swatch-tema" data-tema="vermelho" title="Vermelho" style="background:linear-gradient(135deg,#c0392b 50%,#d9773d 50%);"></button>
          <button class="swatch-tema" data-tema="claro" title="Claro" style="background:#f5f3ec;border-color:#a8623a;"></button>
        </div>
      </div>
    </div>
    <div id="area"></div>
  </main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
